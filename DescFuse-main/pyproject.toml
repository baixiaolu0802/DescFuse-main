[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "descfuse-reproduction"
version = "0.1.0"
description = "Description-supervised facet-aware evidence fusion for ICD coding"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
tables = ["reportlab==4.4.9"]

[tool.setuptools]
packages = ["descfuse"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
